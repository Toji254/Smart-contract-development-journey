# ==============================================================================
# MarkTrail — Nginx Reverse Proxy Configuration
# Production TLS Termination for University Pilot Deployment
# ==============================================================================

# Rate limit zone: 20 requests/second per IP with a burst of 40
limit_req_zone $binary_remote_addr zone=marktrail_limit:10m rate=20r/s;

# ── Redirect HTTP to HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name marks.university.ac.ke;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marks.university.ac.ke;

    # ── SSL Certificates (update with your institution domain or Certbot path) ──
    ssl_certificate /etc/letsencrypt/live/marks.university.ac.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marks.university.ac.ke/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # ── Limits ───────────────────────────────────────────────────────────────
    client_max_body_size 5M;
    server_tokens off;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/marktrail_access.log combined;
    error_log  /var/log/nginx/marktrail_error.log warn;

    # ── Reverse Proxy to Backend ─────────────────────────────────────────────
    location / {
        limit_req zone=marktrail_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Disable buffering for real-time audit responsiveness
        proxy_buffering off;
    }
}
